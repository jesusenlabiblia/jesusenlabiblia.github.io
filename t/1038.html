<h1>El Cristo, un Rey</h1>
<p class="r">Lucas 23:2</p>
<p>Ante Pilato, los del concilio (22:66) acusan a Jesús de pervertir a la nación, de prohibir el tributo a César y de decir «que él mismo es el Cristo, un rey». Enseguida Pilato le pregunta si es el Rey de los judíos (23:3).</p>
