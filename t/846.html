<h1>Éste Será Nuestra Paz</h1>
<p class="r">Miqueas 5:5</p>
<p>Después de anunciar al pastor que nacerá en Belén, Miqueas dice: «Y éste será nuestra paz», cuando el asirio invada la tierra. La lectura cristiana ve aquí a Jesús, de quien Pablo dice: «él es nuestra paz» (Efesios 2:14).</p>
