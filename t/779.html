<h1>Salvará a Su Pueblo de Sus Pecados</h1>
<p class="r">Mateo 1:21</p>
<p>Al darle a José el nombre del niño, el ángel dice para qué viene: «él salvará a su pueblo de sus pecados». En la última cena, Jesús dirá que su sangre se derrama para perdón de los pecados (Mateo 26:28).</p>
