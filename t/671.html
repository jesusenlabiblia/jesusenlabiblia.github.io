<h1>YHWH-Mecadisquim (El Señor que os Santifica)</h1>
<p class="r">Éxodo 31:13</p>
<p>Dios manda a Israel guardar sus días de reposo como señal entre él y su pueblo: «para que sepáis que yo soy Jehová que os santifico». Hebreos 2:11 atribuye a Jesús esa misma obra de santificar.</p>
