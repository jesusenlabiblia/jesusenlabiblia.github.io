<h1>No Se Agradó a Sí Mismo</h1>
<p class="r">Romanos 15:3</p>
<p>Pablo pide a los fuertes que soporten a los débiles y no se agraden a sí mismos (v. 1), y da el ejemplo: «ni aun Cristo se agradó a sí mismo». Le aplica el Salmo 69: los insultos dirigidos a Dios cayeron sobre él.</p>
