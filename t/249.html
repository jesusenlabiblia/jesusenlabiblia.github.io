<h1>Derramará Bendición hasta que Sobreabunde</h1>
<p class="r">Malaquías 3:10</p>
<p>Dios reprocha al pueblo que le roba en los diezmos (vv. 8-9) y lo desafía: «probadme ahora en esto», si no abrirá las ventanas de los cielos y derramará sobre ellos «bendición hasta que sobreabunde».</p>
