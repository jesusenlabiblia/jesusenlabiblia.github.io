<h1>El Unigénito del Padre</h1>
<p class="r">Juan 1:14</p>
<p>Los que vieron al Verbo hecho carne dan testimonio de su gloria: «gloria como del unigénito del Padre», lleno de gracia y de verdad. En el v. 18, el prólogo vuelve a llamarlo el Unigénito, que está en el seno del Padre.</p>
