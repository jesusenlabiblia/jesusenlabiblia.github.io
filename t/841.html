<p class="r">Isaías 63:9</p>
<p>Recordando la historia de Israel, el profeta dice que en toda angustia de su pueblo Dios fue angustiado, y que el ángel de su faz los salvó y los redimió en su amor. Muchos ven en ese ángel a Cristo antes de la encarnación.</p>
